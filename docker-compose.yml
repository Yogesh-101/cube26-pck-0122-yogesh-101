version: "3.9"

services:
  pack-manager:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      STORAGE_ROOT: /app/storage
      DATABASE_PATH: /app/storage/pack_manager.db
      IMAGE_STORAGE_PATH: /app/storage/images
    volumes:
      # Single durable volume: SQLite DB + package photos survive restarts
      - pack_data:/app/storage
    restart: unless-stopped

volumes:
  pack_data:
